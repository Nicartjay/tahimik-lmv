<!doctype html>
<html lang="tl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="icon" href="data:," />
  <title>Tahimik Pero Ako ’To — video</title>
  <style>
    html, body { margin: 0; height: 100%; background: #050507; color: #9A9EA6; overflow: hidden;
      font: 12px/1.4 'IBM Plex Mono', ui-monospace, monospace; }
    #stage { position: absolute; inset: 0 0 44px 0; display: grid; place-items: center; }
    canvas#out { max-width: 100%; max-height: 100%; aspect-ratio: 16 / 9; background: #000; }
    #bar { position: absolute; left: 0; right: 0; bottom: 0; height: 44px; display: flex; align-items: center;
      gap: 12px; padding: 0 12px; box-sizing: border-box; border-top: 1px solid #1c1e24; }
    #scrub { position: relative; flex: 1; height: 26px; cursor: pointer; }
    #scrub .seg { position: absolute; top: 4px; bottom: 4px; border-left: 1px solid #3a3e48;
      overflow: hidden; white-space: nowrap; padding-left: 4px; font-size: 10px; color: #5A5F6A; }
    #scrub .head { position: absolute; top: 0; bottom: 0; width: 1px; background: #FFD66B; }
    #info { min-width: 260px; text-align: right; white-space: nowrap; }
    #help { position: absolute; top: 8px; right: 12px; font-size: 10px; color: #5A5F6A; text-align: right; }
  </style>
</head>
<body>
  <div id="stage"><canvas id="out"></canvas></div>
  <div id="bar"><span id="play">▶</span><div id="scrub"></div><span id="info"></span></div>
  <div id="help">space play · ←/→ 2s · shift 10s · , . frame · [ ] scene · 1–9 samples · g grid</div>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
